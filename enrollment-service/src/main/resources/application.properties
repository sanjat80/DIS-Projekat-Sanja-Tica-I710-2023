server.port=8083
spring.application.name=enrollment-service

eureka.client.service-url.defaultZone=http://eureka:8761/eureka/

spring.cloud.config.enabled=false

spring.datasource.url=jdbc:postgresql://postgres:5432/studentska_baza
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.notification.exchange=notification.exchange
app.notification.routing-key=notification.routingKey

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted

service.auth.token=internal-microservices-communication-token